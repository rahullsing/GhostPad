[project]
name = "ghostpad"
version = "1.0.0"
description = "A private, always-on-top scratchpad for Windows that screen sharing cannot see."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []  # standard library only (tkinter + ctypes)
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "ruff>=0.6", "mypy>=1.10"]

# --------------------------------------------------------------------------- #
# Ruff: linting + formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = ["*.pyw"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "N",       # pep8-naming
]
ignore = [
    "N801",    # ctypes structures keep their Win32 names (CWPSTRUCT, WINDOWPOS)
    "RUF001",  # intentional Unicode glyphs in UI strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# Mypy: static type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
platform = "win32"
files = ["ghostpad.pyw", "tools/make_icon.py"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
