name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller
      - name: Install Inno Setup (skipped if the runner already has it)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build exe, portable zip and installer
        shell: pwsh
        run: ./tools/build.ps1 -SkipTests  # tests already ran in the test job
      - uses: actions/upload-artifact@v4
        with:
          name: Ghostpad-windows
          path: |
            dist/Ghostpad-*-portable.zip
            dist/installer/Ghostpad-Setup-*.exe
